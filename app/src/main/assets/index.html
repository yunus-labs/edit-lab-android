            (lessons
              .map((l, i) =>
                data.notes[key(i)]?.trim()
                  ? '<article class="panel"><h3>Week ' +
                    (i + 1) +
                    " · " +
                    l[0] +
                    '</h3><p style="white-space:pre-wrap">' +
                    esc(data.notes[key(i)]) +
                    '</p><button data-open="' +
                    i +
                    '">Note edit karo</button></article>'
                  : "",
              )
              .join("") ||
              '<div class="panel">Kisi project ko kholo aur apna pehla note likho.</div>');
        }
        if (view === "lesson") body = lesson(current);
        if (view === "studio") body = studioView();
        if (view === "studio-lesson") body = studioLesson();
        if (view === "skills") body = skillsPage();
        if (view === "skill-category") body = skillCategoryPage();
        if (view === "skill-project") body = skillProjectPage();
        const switcher =
          '<section class="device" aria-label="Editing device"><div><strong>Kis par edit karoge?</strong><div class="muted">Har track ka progress alag save hota hai.</div></div><div class="device-buttons"><button data-track="phone" aria-pressed="' +
          (track === "phone") +
          '">Phone</button><button data-track="pc" aria-pressed="' +
          (track === "pc") +
          '">PC</button></div></section>';
        $("#app").innerHTML =
          switcher +
          '<p id="storage" role="alert" ' +
          (storageFailed ? "" : "hidden") +
          ">Browser mein save nahi ho paaya. Storage settings check karo.</p>" +
          body;
        if (view === "road") {
          $("#level").value = filters.level;
          $("#status").value = filters.status;
          list();
        }
        if (view === "lesson") updatePreview();
      }
      function stamp(s) {
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }
      function animation(i, scene) {
        if (scene === 5)
          return {
            type: "hold",
            duration: 0.3,
            label: "Last 0.3 sec fade out",
          };
        const type = [
          "fade",
          "pop",
          "fade",
          "pop",
          "slide",
          "fade",
          "slide",
          "mask",
          "scale",
          "fade",
          "hold",
          "pop",
          "fade",
          "fade",
          "pop",
          "pop",
        ][i];
        const duration = [
          0.3, 0.2, 0.2, 0.2, 0.3, 0.4, 0.35, 0.5, 0.4, 0.3, 1, 0.2, 0.3, 0.2,
          0.2, 0.2,
        ][i];
        if (i === 10)
          return [
            { type: "fade", duration: 0.2, label: "Fade 0.2 sec" },
            { type: "pop", duration: 0.15, label: "Pop 0.15 sec" },
            { type: "slide", duration: 0.6, label: "Slide 0.6 sec" },
            { type: "hold", duration: 1, label: "Static hold" },
            { type: "pop", duration: 0.2, label: "Pop 0.2 sec" },
          ][scene];
        if ((i === 11 || i === 15) && scene === 4)
          return { type: "fade", duration: 0.4, label: "CTA fade 0.4 sec" };
        const label =
          i === 3
            ? "Beat par pop 0.2 sec"
            : i === 14
              ? "Impact frame par pop 0.2 sec"
              : type[0].toUpperCase() + type.slice(1) + " " + duration + " sec";
        return { type, duration, label };
      }
      function lesson(i) {
        let l = lessons[i],
          titles = [l[6], ...l[7].split("|"), "Edit by me"],
          ends =
            i === 0
              ? [0, 4, 11, 18, 25, 32, 36]
              : [
                  0,
                  4,
                  Math.round(l[3] * 0.3),
                  Math.round(l[3] * 0.48),
                  Math.round(l[3] * 0.68),
                  l[3] - 4,
                  l[3],
                ],
          horizontal = l[4] === "16:9",
          size = horizontal ? "1920 × 1080" : "1080 × 1920";
        previewData = { titles, ends, i };
        let steps = [
          "Phone ki Camera app kholo. Lens ko soft kapde se saaf karo. " +
            (horizontal ? "Phone sideways pakdo." : "Phone seedha pakdo.") +
            " " +
            l[5] +
            " ready rakho.",
          l[8] +
            (i === 0
              ? " Camera mein video mode chuno, red Record dabao, action karo aur Stop dabao. Opening aur ending ke liye blank white paper ka shot bhi lo."
              : "") +
            " Har shot ko zaroorat se 2 sec lamba record karo.",
          "Apni editing app kholo aur New Project banao. Gallery se clips select karke Add dabao. Canvas ya Ratio mein " +
            (horizontal ? "16:9" : "9:16") +
            " chuno.",
          "Neeche wali timeline mein clips left se right arrange karo. Timeline video ka time dikhati hai. Playhead ko cut ki jagah le jao, Split dabao, aur extra tukda select karke Delete karo.",
          l[9],
          "Text → Add Text dabao. Storyboard se line type karo. Timeline mein text bar ke dono kinare kheench kar start aur end time set karo. " +
            (i === 0
              ? "Plain black text aur white background rakho. Fade option mile to use chuno."
              : "Text motion ke liye timing column follow karo."),
          "Play dabao. Phone par dekho ki har line padhne ke liye kaafi waqt hai. Awaz add ki hai to bina headphones bhi suno.",
          "Export menu kholo. Practice target " +
            size +
            ", 30 fps aur MP4 rakho. File ka naam Week-" +
            String(i + 1).padStart(2, "0") +
            " rakho." +
            (l[4].includes("+")
              ? " Horizontal cut ko 1920 × 1080 mein alag export karo."
              : ""),
        ];
        if (track === "pc") {
          steps[0] =
            "Footage phone ya camera se record karo. " +
            (horizontal ? "Camera sideways rakho." : "Camera seedha rakho.") +
            " " +
            l[5] +
            " ready rakho.";
          steps[2] =
            "Computer par Week-" +
            String(i + 1).padStart(2, "0") +
            " folder banao. Uske andar Footage, Audio aur Exports folders banao. USB ya file transfer se clips Footage mein copy karo. Editor kholo, New Project banao, Import dabao aur clips select karo.";
          steps[3] =
            "New Timeline ya Sequence banao. Size " +
            size +
            " aur 30 fps set karo. Media bin (clips ki list) se pehli clip timeline ke V1 video track par drag karo. Spacebar se play/pause karo. Playhead ko cut par rakho, Split ya Blade se kaato, extra tukda select karke Delete dabao.";
          steps[4] += " PC par: " + pcPractice[i][0];
          steps[5] =
            "Titles ya Text panel se plain title timeline mein V1 ke upar rakho. Inspector ya Properties panel mein text likho, size aur position badlo. Clip ke left aur right edges drag karke storyboard ke times set karo. " +
            (i === 0
              ? "White background ke liye solid color layer use karo. Text black rakho."
              : "Storyboard ki animation timing follow karo.");
          steps[6] =
            "Spacebar se poora playback dekho. Export ke baad MP4 ko computer par kholo. Vertical edit ho to phone par bhi text aur audio check karo.";
          steps[7] =
            "Export ya Render menu mein MP4 (H.264), " +
            size +
            " aur 30 fps select karo. Exports folder choose karke Export dabao." +
            (l[4].includes("+")
              ? " Horizontal version bhi 1920 × 1080 mein alag save karo."
              : "");
        }
        return (
          '<div class="section"><button data-nav="road">← Roadmap</button>' +
          saveButton(i) +
          '</div><div class="lesson"><div><section class="panel"><small>WEEK ' +
          (i + 1) +
          " / " +
          trackName().toUpperCase() +
          " / " +
          l[1].toUpperCase() +
          " / " +
          l[2].toUpperCase() +
          "</small><h1>" +
          l[0] +
          "</h1><p>" +
          l[3] +
          " sec · " +
          l[4] +
          (i === 11
            ? " · 60-sec horizontal version"
            : i === 15
              ? " · 45 sec per version"
              : "") +
          " · " +
          l[5] +
          "</p>" +
          (i === 0
            ? "<details open><summary>Start yahan se · screen ko samjho</summary><p>" +
              (track === "phone"
                ? "Phone par ek video editor kholo. New Project se shuru karo. Gallery mein video milta hai. Preview upar dikhta hai aur neeche timeline mein clips left se right chalti hain. Timeline mein do ungliyon se zoom karke exact cut dekho."
                : "Computer par ek video editor kholo. Media bin mein files aati hain, preview mein result dikhta hai aur timeline mein clips ka order banta hai. V1 pehle video track ka naam hai aur A1 pehle audio track ka. Editor ke hisaab se buttons ke naam thode alag ho sakte hain.") +
              "</p></details>"
            : "") +
          "<details open><summary>1. Mini storyboard aur text timing</summary>" +
          titles
            .map(
              (t, j) =>
                '<div class="scene"><span class="time">' +
                stamp(ends[j]) +
                "–" +
                stamp(ends[j + 1]) +
                "</span><div><strong>" +
                t +
                '</strong><br><span class="muted">' +
                (j === 0
                  ? "Hook / opening shot"
                  : j === 5
                    ? "End card / final frame"
                    : "Shot " + j) +
                " · " +
                animation(i, j).label +
                "</span></div></div>",
            )
            .join("") +
          '</details><details open><summary>2. Editing ke chhote steps</summary><ol class="steps">' +
          steps.map((x) => "<li>" + x + "</li>").join("") +
          "</ol>" +
          (track === "pc"
            ? "<p><strong>Practice target</strong> · " +
              pcPractice[i][1] +
              "</p>"
            : "") +
          "</details><details><summary>3. Thumbnail aur caption draft</summary><p><strong>Thumbnail</strong> · " +
          l[10] +
          ". Result shot select karo, title ko center ke paas rakho aur background ke opposite color ka text use karo.</p><p><strong>Caption</strong> · " +
          l[11] +
          "</p></details><details open><summary>4. Export checklist</summary>" +
          checks
            .concat(
              l[4].includes("+")
                ? [
                    "Vertical aur horizontal dono MP4 files alag export aur review ki",
                  ]
                : [],
            )
            .map(
              (x, j) =>
                '<label class="check"><input type="checkbox" data-check="' +
                j +
                '" ' +
                (data.checks[key(i)]?.[j] ? "checked" : "") +
                "> " +
                x +
                "</label>",
            )
            .join("") +
          '<button class="primary" id="complete">' +
          (data.done[key(i)]
            ? "↶ Pending mark karo"
            : "✓ Completed mark karo") +
          '</button> <span class="status ' +
          (data.done[key(i)] ? "done" : "") +
          '">' +
          (data.done[key(i)] ? "Completed" : "Pending") +
          '</span></details></section></div><aside><section class="panel"><small>TEXT TIMING PREVIEW</small><div class="preview" style="' +
          (horizontal ? "aspect-ratio:16/9;width:100%" : "") +
          '"><span id="preview-text"></span></div><div class="preview-controls"><button id="play" aria-label="Play preview">▶</button><input type="range" id="seek" aria-label="Preview time" min="0" max="' +
          l[3] +
          '" value="0" step="0.1"></div><p class="time" id="clock"></p></section><section class="panel"><label for="note"><strong>Project notes</strong></label><p class="muted">Kahan atke? Agli baar kya try karoge?</p><textarea id="note" rows="5" placeholder="Yahan likho…">' +
          esc(data.notes[key(i)]) +
          '</textarea><small id="note-status" role="status">Isi browser mein auto-save</small></section>' +
          (i < lessons.length - 1
            ? '<button data-open="' +
              (i + 1) +
              '">Week ' +
              (i + 2) +
              " dekho →</button>"
            : "") +
          "</aside></div>"
        );
      }
      function updatePreview() {
        const { titles, ends, i } = previewData;
        const j = ends.findIndex((x, i) => i > 0 && at < x);
        const scene = j < 0 ? titles.length - 1 : j - 1;
        const node = $("#preview-text");
        node.textContent = titles[scene];
        const motion = animation(i, scene);
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const phase = reduced
          ? 1
          : Math.min(1, (at - ends[scene]) / motion.duration);
        const eased = 1 - (1 - phase) ** 2;
        node.style.opacity = reduced
          ? "1"
          : String(
              scene === titles.length - 1
                ? Math.min(1, (ends.at(-1) - at) / 0.3)
                : motion.type === "hold" ||
                    motion.type === "mask" ||
                    motion.type === "scale"
                  ? 1
                  : phase,
            );
        node.style.transform =
          motion.type === "slide"
            ? "translateY(" + (1 - eased) * 22 + "px)"
            : motion.type === "pop" || motion.type === "scale"
              ? "scale(" +
                (1 - (1 - eased) * (motion.type === "scale" ? 0.05 : 0.2)) +
                ")"
              : "none";
        node.style.clipPath =
          motion.type === "mask"
            ? "inset(0 " + (1 - phase) * 100 + "% 0 0)"
            : "none";
        $("#seek").value = at;
        $("#clock").textContent =
          stamp(Math.floor(at)) + " / " + stamp(lessons[current][3]);
      }
      function go(v) {
        view = v;
        render();
        window.scrollTo(0, 0);
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.track) {
          if (track === b.dataset.track) return;
          track = b.dataset.track;
          filters = { q: "", level: "", status: "" };
          try {
            localStorage.setItem("edit-lab-device", track);
          } catch {}
          go(view === "lesson" ? "road" : view);
          return;
        }
        if (b.dataset.skill !== undefined) {
          activeSkill = Number(b.dataset.skill);
          go("skill-category");
          return;
        }
        if (b.dataset.skillProject !== undefined) {
          activeSkillProject = Number(b.dataset.skillProject);
          go("skill-project");
          return;
        }
        if (b.hasAttribute("data-skill-complete")) {
          const id = skillKey(activeSkill, activeSkillProject);
          const completed = !skillDone(activeSkill, activeSkillProject);
          skillProgress[id] = completed;
          const status = $("#skill-status");
          try {
            localStorage.setItem(skillStorage, JSON.stringify(skillProgress));
            status.textContent = completed ? "Completed" : "Pending";
          } catch {
            status.textContent = "Browser mein save nahi hua";
          }
          status.classList.toggle("done", completed);
          b.textContent = completed
            ? "Pending mark karo"
            : "Completed mark karo";
          return;
        }
        if (b.dataset.studio !== undefined) {
          studioIndex = Number(b.dataset.studio);
          go("studio-lesson");
          return;
        }
        if (b.dataset.nav) {
          go(b.dataset.nav);
          return;
        }
        if (b.dataset.open !== undefined) {
          current = Number(b.dataset.open);
          go("lesson");
          return;
        }
        if (b.dataset.save !== undefined) {
          let i = Number(b.dataset.save);
          data.saved[key(i)] = !data.saved[key(i)];
          if (view === "saved") render();
          else {
            b.textContent = data.saved[key(i)] ? "★ Saved" : "☆ Save";
            b.setAttribute("aria-pressed", data.saved[key(i)]);
            const stats = document.querySelector(".stat:last-child strong");
            if (stats)
              stats.textContent = lessons.filter(
                (_, k) => data.saved[key(k)],
              ).length;
          }
          save();
          return;
        }
        if (b.dataset.remove !== undefined) {
          data.ideas.splice(Number(b.dataset.remove), 1);
          render();
          save();
          return;
        }
        if (b.id === "complete") {
          data.done[key(current)] = !data.done[key(current)];
          b.textContent = data.done[key(current)]
            ? "↶ Pending mark karo"
            : "✓ Completed mark karo";
          b.nextElementSibling.textContent = data.done[key(current)]
            ? "Completed"
            : "Pending";
          b.nextElementSibling.classList.toggle(
            "done",
            data.done[key(current)],
          );
          save();
          return;
        }
        if (b.id === "play") {
          if (timer) {
            clearInterval(timer);
            timer = null;
            b.textContent = "▶";
            b.setAttribute("aria-label", "Play preview");
            return;
          }
          if (at >= lessons[current][3]) {
            at = 0;
            updatePreview();
          }
          const start = performance.now() - at * 1000;
          b.textContent = "Ⅱ";
          b.setAttribute("aria-label", "Pause preview");
          timer = setInterval(() => {
            at = Math.min(
              lessons[current][3],
              (performance.now() - start) / 1000,
            );
            updatePreview();
            if (at >= lessons[current][3]) b.click();
          }, 80);
        }
      });
      document.addEventListener("input", (e) => {
        const x = e.target;
        if (x.id === "query") {
          filters.q = x.value;
          list();
        }
        if (x.id === "note") {
          data.notes[key(current)] = x.value;
          $("#note-status").textContent = save()
            ? "Note saved"
            : "Note save nahi hua";
        }
        if (x.id === "seek") {
          if (timer) $("#play").click();
          at = Number(x.value);
          updatePreview();
        }
      });
      document.addEventListener("change", (e) => {
        const check = e.target.dataset.studioCheck;
        if (check !== undefined) {
          const project = studioProjects[studioIndex];
          const score = studioScore(project);
          score[Number(check)] = e.target.checked;
          studioScores[studioKey(project)] = score;
          const label =
            studioCount(project) +
            " / " +
            project.review.length +
            " checks passed";
          try {
            localStorage.setItem(
              "edit-lab-studio-v1",
              JSON.stringify(studioScores),
            );
            $("#studio-score").textContent = label;
          } catch {
            $("#studio-score").textContent = label + " · save nahi hua";
          }
          return;
        }

        const x = e.target;
        if (x.id === "level" || x.id === "status") {
          filters[x.id] = x.value;
          list();
        }
        if (x.dataset.check !== undefined) {
          (data.checks[key(current)] ??= {})[x.dataset.check] = x.checked;
          save();
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id === "idea") {
          e.preventDefault();
          let value = new FormData(e.target).get("idea").trim();
          if (value) {
            data.ideas.push(value);
            render();
            save();
            $("#idea input").focus();
          }
        }
      });
      render();
    </script>
  </body>
</html>
