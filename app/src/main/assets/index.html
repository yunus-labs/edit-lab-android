      function updatePreview() {
        const { titles, ends, i } = previewData;
        const j = ends.findIndex((x, i) => i > 0 && at < x);
        const scene = j < 0 ? titles.length - 1 : j - 1;
        const node = $("#preview-text");
        node.textContent = titles[scene];
        const motion = animation(i, scene);
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const phase = reduced
          ? 1
          : Math.min(1, (at - ends[scene]) / motion.duration);
        const eased = 1 - (1 - phase) ** 2;
        node.style.opacity = reduced
          ? "1"
          : String(
              scene === titles.length - 1
                ? Math.min(1, (ends.at(-1) - at) / 0.3)
                : motion.type === "hold" ||
                    motion.type === "mask" ||
                    motion.type === "scale"
                  ? 1
                  : phase,
            );
        node.style.transform =
          motion.type === "slide"
            ? "translateY(" + (1 - eased) * 22 + "px)"
            : motion.type === "pop" || motion.type === "scale"
              ? "scale(" +
                (1 - (1 - eased) * (motion.type === "scale" ? 0.05 : 0.2)) +
                ")"
              : "none";
        node.style.clipPath =
          motion.type === "mask"
            ? "inset(0 " + (1 - phase) * 100 + "% 0 0)"

          stamp(Math.floor(at)) + " / " + stamp(lessons[current][3]);

          if (view === "saved") render();
          else {
            b.textContent = data.saved[key(i)] ? "★ Saved" : "☆ Save";
            b.setAttribute("aria-pressed", data.saved[key(i)]);
            const stats = document.querySelector(".stat:last-child strong");
            if (stats)
              stats.textContent = lessons.filter(
                (_, k) => data.saved[key(k)],
              ).length;
          }
          save();
          return;
        }
        if (b.dataset.remove !== undefined) {
          data.ideas.splice(Number(b.dataset.remove), 1);
          render();
          save();
          return;
        }
        if (b.id === "complete") {
          data.done[key(current)] = !data.done[key(current)];
          b.textContent = data.done[key(current)]
            ? "↶ Pending mark karo"
            : "✓ Completed mark karo";
          b.nextElementSibling.textContent = data.done[key(current)]
            ? "Completed"
            : "Pending";
          b.nextElementSibling.classList.toggle(
            "done",
            data.done[key(current)],
          );
          save();
          return;
        }
        if (b.id === "play") {
          if (timer) {
            clearInterval(timer);
            timer = null;
            b.textContent = "▶";
            b.setAttribute("aria-label", "Play preview");
            return;
          }
          if (at >= lessons[current][3]) {
            at = 0;
            updatePreview();
          }
          const start = performance.now() - at * 1000;
          b.textContent = "Ⅱ";
          b.setAttribute("aria-label", "Pause preview");
          timer = setInterval(() => {
            at = Math.min(
              lessons[current][3],
              (performance.now() - start) / 1000,
            );
            updatePreview();
            if (at >= lessons[current][3]) b.click();
          }, 80);
        }
      });
      document.addEventListener("input", (e) => {
        const x = e.target;
        if (x.id === "query") {
          filters.q = x.value;
          list();
        }
        if (x.id === "note") {
          data.notes[key(current)] = x.value;
          $("#note-status").textContent = save()
            ? "Note saved"
            : "Note save nahi hua";
        }
        if (x.id === "seek") {
          if (timer) $("#play").click();
          at = Number(x.value);
          updatePreview();
        }
      });
      document.addEventListener("change", (e) => {
        const x = e.target;
        if (x.id === "level" || x.id === "status") {
          filters[x.id] = x.value;
          list();
        }
        if (x.dataset.check !== undefined) {
          (data.checks[key(current)] ??= {})[x.dataset.check] = x.checked;
          save();
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id === "idea") {
          e.preventDefault();
          let value = new FormData(e.target).get("idea").trim();
          if (value) {
            data.ideas.push(value);
            render();
            save();
            $("#idea input").focus();
          }
        }
      });
      render();
    </script>
  </body>
</html>
